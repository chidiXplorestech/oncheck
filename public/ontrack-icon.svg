<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ONTRACK app icon</title>
  <desc id="desc">The ONTRACK neon lime broken target ring and forward track arrow on a black rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171A1F"/>
      <stop offset="1" stop-color="#090B0E"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9FFF1F"/>
      <stop offset="0.55" stop-color="#B7FF32"/>
      <stop offset="1" stop-color="#D7FF75"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="226" fill="url(#bg)"/>
  <g transform="translate(0 4)" filter="url(#glow)">
    <circle cx="512" cy="512" r="310" fill="none" stroke="url(#lime)" stroke-width="108" stroke-linecap="butt" stroke-dasharray="1626 324" transform="rotate(-132 512 512)"/>
    <path d="M294 462h250l114-114 78 78-86 86 86 86-78 78-114-114H294l102-100z" fill="url(#lime)"/>
    <path d="M426 462h118l114-114 78 78-86 86 86 86-78 78-114-114H426l102-100z" fill="#111419"/>
    <path d="M294 562h204L396 664z" fill="#D7FF75"/>
  </g>
</svg>
