name: ONCHECK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Single-file offline build
        run: npm run build:offline

      - name: Verify offline artifact
        run: test -s dist/oncheck-offline.html

      - name: Upload offline phone build
        uses: actions/upload-artifact@v4
        with:
          name: oncheck-offline
          path: dist/oncheck-offline.html
          if-no-files-found: error
          retention-days: 30
