name: ONTRACK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Home state regression tests
        run: node --experimental-strip-types --test unit-tests/*.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build for UI regression tests
        env:
          VITE_E2E_BYPASS_AUTH: '1'
        run: npm run build

      - name: Install Chromium for UI regression tests
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontrack-ui-review
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Single-file offline build
        run: npm run build:offline

      - name: Verify offline artifact
        run: test -s dist/oncheck-offline.html

      - name: Review production account entry
        env:
          ONTRACK_AUTH_VISUAL: '1'
        run: npx playwright test tests/auth-visual.spec.ts --output auth-test-results

      - name: Upload account review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontrack-auth-review
          path: auth-test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload offline phone build
        uses: actions/upload-artifact@v4
        with:
          name: ontrack-offline
          path: dist/oncheck-offline.html
          if-no-files-found: error
          retention-days: 30
